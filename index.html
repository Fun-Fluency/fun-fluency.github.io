<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor Hub · Fun Fluency</title>
<meta name="apple-mobile-web-app-title" content="Mentor Hub">
<meta name="theme-color" content="#3ec0c7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #2b1316;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 120px; height: 120px; }
  h1 { margin: 12px 0 4px; font-size: 26px; }
  p { margin: 0 0 18px; color: #6b5458; }
  a.btn { display: inline-block; background: #3ec0c7; color: #fff; text-decoration: none; font-weight: 800; padding: 12px 22px; border-radius: 99px; }
  .bar { height: 6px; width: 180px; margin: 18px auto 0; background: linear-gradient(90deg, #3ec0c7 33%, #f8cf19 33% 66%, #ec406d 66%); border-radius: 99px; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Fun Fluency">
  <h1>Mentor Hub</h1>
  <p>Opening… sign in with your Fun Fluency account if asked.</p>
  <a class="btn" id="go" href="#">Open Mentor Hub</a>
  <div class="bar"></div>
</main>
<script>
  // ⬇️ Paste your Mentor Hub web app URL here (Deploy → Manage deployments → Web app URL)
  var APP_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
  var go = document.getElementById("go");
  var url = APP_URL + (location.search || "");   // keeps a teacher's personal ?t= link
  go.href = url;
  if (/^https:\/\//.test(APP_URL)) setTimeout(function () { location.replace(url); }, 600);
  else go.textContent = "Add the app link in index.html first";
</script>
</body>
</html>
