<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Hub · Fun Fluency</title>
<meta name="apple-mobile-web-app-title" content="Teacher Hub">
<meta name="theme-color" content="#3ec0c7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #2b1316;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 120px; height: 120px; }
  h1 { margin: 12px 0 4px; font-size: 26px; }
  p { margin: 0 0 18px; color: #6b5458; }
  a.btn { display: inline-block; background: #3ec0c7; color: #fff; text-decoration: none; font-weight: 800; padding: 12px 22px; border-radius: 99px; }
  .bar { height: 6px; width: 180px; margin: 18px auto 0; background: linear-gradient(90deg, #3ec0c7 33%, #f8cf19 33% 66%, #ec406d 66%); border-radius: 99px; }
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="Fun Fluency Teacher Hub">
  <h1>Teacher Hub</h1>
  <p id="msg">Opening… sign in with your Fun Fluency account if asked.</p>
  <a class="btn" id="go" href="#">Open Teacher Hub</a>
  <div class="bar"></div>
</main>
<script>
  // Mentor Hub web app URL (Deploy → Manage deployments → Web app URL)
  var APP_URL = "https://script.google.com/a/macros/funfluency.com/s/AKfycbz-MilUnSudyilv2jCtHnq-krGiVKs314rZKSKan3fK0SJq0-uIN_kiDSiuorzO9iXamg/exec";
  var params = new URLSearchParams(location.search);
  var installing = params.has("install") || params.has("add");
  params.delete("install"); params.delete("add");
  var qs = params.toString() ? "?" + params.toString() : "";
  var url = APP_URL + qs;                       // keeps a teacher's personal ?t= link
  var go = document.getElementById("go");
  go.href = url;
  if (installing) {
    // Stay on this page (so the phone saves the Fun Fluency icon) and drop "?install" from the address,
    // so the saved icon opens Mentor Hub normally.
    history.replaceState(null, "", location.pathname + qs);
    document.getElementById("msg").innerHTML = "<b>Save Teacher Hub to your home screen:</b><br>" +
      "iPhone / iPad: tap <b>Share</b> (square with an arrow) → <b>Add to Home Screen</b> → <b>Add</b>.<br>" +
      "Android: tap <b>⋮</b> → <b>Add to Home screen</b>.<br>Computer (Chrome): <b>⋮ → Cast, save, and share → Create shortcut</b> → check <b>Open as window</b>.";
  } else {
    setTimeout(function () { location.replace(url); }, 500);
  }
</script>
</body>
</html>
